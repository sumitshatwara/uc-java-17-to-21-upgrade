spring.application.name=loan-service

# Legacy Data Source Configuration
# This connects to the legacy data warehouse (CDW-style) tables
# MIGRATION TARGET: Replace with modern schema connection
spring.datasource.url=jdbc:h2:mem:legacydw;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.open-in-view=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Initialize legacy schema on startup
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-legacy.sql
spring.sql.init.data-locations=classpath:data-legacy.sql

# Borrower exposure fan-out (simulated remote reads on a fixed pool)
loan.public-base-url=https://loans.example.com
loan.exposure.pool-size=4
loan.exposure.simulated-latency-ms=50
